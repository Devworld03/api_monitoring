global:
  scrape_interval: 5s       # how often Prometheus pulls /metrics from the app
  evaluation_interval: 5s   # how often alert rules are checked

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fastapi-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
